[package]
name = "todoist"
version = "0.1.0"
authors = ["Nexuz <nexxuz0@googlemail.com>"]
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["json", "form"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
tokio = { version = "1.51.1", features = ["macros"]}